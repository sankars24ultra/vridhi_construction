[project]
name = "vridhi-backend"
version = "0.1.0"
description = "Local-first API for Vridhi Constructions & Designs"
requires-python = ">=3.12,<3.15"
dependencies = [
    "alembic>=1.15,<2",
    "argon2-cffi>=23.1,<26",
    "asyncpg>=0.30,<1",
    "email-validator>=2.2,<3",
    "fastapi>=0.115,<1",
    "itsdangerous>=2.2,<3",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.7,<3",
    "python-dotenv>=1.0,<2",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy[asyncio]>=2.0.38,<3",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "starlette>=0.40,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"
